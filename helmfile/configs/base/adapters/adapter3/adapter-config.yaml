# HyperFleet Adapter deployment configuration for adapter3
adapter:
  name: adapter3

# Log the full merged configuration after load (default: false)
debug_config: false
log:
  level: info

clients:
  hyperfleet_api:
    base_url: http://hyperfleet-api:8000
    version: v1
    timeout: 2s
    retry_attempts: 3
    retry_backoff: exponential


  kubernetes:
    api_version: "v1"
    #kube_config_path: PATH_TO_KUBECONFIG  # for local development
